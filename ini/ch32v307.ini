#
# CH32V307 RISC-V (QingKe V4F Core)
#
[env:CH32V307_marlin]
# Прямая ссылка на репозиторий платформы. Слэши здесь не ломают Marlin!
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board     = ch32v307_custom
framework = noneos-sdk
upload_protocol = custom
upload_command = wlink flash $SOURCE

lib_deps = https://github.com/IProg1010/lwip.git#STABLE-2_1_x

build_flags       = 
  ${common.build_flags}
  -D__MARLIN_FIRMWARE__
  -DHAL_PLATFORM=HAL_CH32V307
  -march=rv32imafc_zicsr_zifencei -mabi=ilp32f
  -msmall-data-limit=8
  -IMarlin/src/HAL/CH32V307
  -I Marlin/src/HAL/CH32V307/ethernet
  -I .pio/libdeps/CH32V307_marlin/lwip/src/include
  -Wl,-u_printf_float 

build_src_filter  = ${common.default_src_filter} +<src/HAL/CH32V307> -<.pio/libdeps/CH32V307_marlin/lwip/src/apps/*>
